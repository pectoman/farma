<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ausencias">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ausencias">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
/* ========================================================================== */
/* Control de ausencias — Design System (handoff)                              */
/* ========================================================================== */
:root{
  /* Superficies */
  --surface:#f8f9ff;
  --surface-dim:#cbdbf5;
  --surface-lowest:#ffffff;
  --surface-low:#eff4ff;
  --surface-container:#e4eeff;
  --surface-high:#d8e5ff;
  --surface-highest:#cbdbf5;
  /* Texto y bordes */
  --on-surface:#0b1c30;
  --on-surface-variant:#424752;
  --outline:#727783;
  --outline-variant:#c2c6d4;
  /* Marca */
  --primary:#1e40af;
  --primary-hover:#1d3899;
  --primary-container:#e0e7ff;
  --on-primary:#ffffff;
  --on-primary-container:#1e3a8a;
  /* Foco */
  --focus-ring:#2563eb;
  /* Error / peligro */
  --error:#dc2626;
  --error-hover:#b91c1c;
  --on-error:#ffffff;
  --error-container:#fef2f2;
  --on-error-container:#991b1b;
  --error-border:#fecaca;
  /* Semántica de ausencias */
  --vac:#2563eb;      --vac-bg:#eff6ff;      --vac-border:#bfdbfe;
  --baja:#dc2626;     --baja-bg:#fef2f2;     --baja-border:#fecaca;
  --visita:#d97706;   --visita-bg:#fffbeb;   --visita-border:#fde68a;
  --permiso:#059669;  --permiso-bg:#ecfdf5;  --permiso-border:#a7f3d0;
  --guardia:#be123c;  --guardia-bg:#fff1f2;  --guardia-border:#fecdd3;
  /* Capas y transiciones */
  --backdrop:rgba(11,28,48,.48);
  --z-nav:50;
  --z-modal:110;
  --z-toast:150;
  --t-fast:150ms cubic-bezier(.4,0,.2,1);
  --t-normal:220ms cubic-bezier(.4,0,.2,1);
  /* Tipografía */
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --text-xs:11px; --text-sm:12px; --text-base:13px; --text-md:14px;
  --text-lg:16px; --text-xl:18px; --text-2xl:20px; --text-3xl:24px; --text-4xl:30px;
  --leading-tight:1.15; --leading-snug:1.3; --leading-normal:1.45;
  /* Espaciado */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px;
  /* Radios y sombras */
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
  --radius-xl:16px; --radius-2xl:20px; --radius-full:9999px;
  --shadow-sm:0 1px 2px rgb(15 23 42 / .05);
  --shadow-card:0 1px 3px rgb(15 23 42 / .06),0 1px 2px -1px rgb(15 23 42 / .05);
  --shadow-md:0 4px 10px -2px rgb(15 23 42 / .08),0 2px 4px -2px rgb(15 23 42 / .05);
  --shadow-modal:0 20px 25px -5px rgb(11 28 48 / .18),0 8px 10px -6px rgb(11 28 48 / .1);
  /* Layout */
  --content-max:1120px;
  --header-h:64px;
}

/* ========================================================================== */
/* Base                                                                       */
/* ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  font-size:var(--text-md);
  line-height:var(--leading-normal);
  color:var(--on-surface);
  background:var(--surface);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
h1,h2,h3,h4,p{margin:0}
b,strong{font-weight:600}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
::selection{background:var(--primary-container);color:var(--on-primary-container)}

/* ========================================================================== */
/* Cabecera y navegación                                                      */
/* ========================================================================== */
.app-header{
  position:fixed;top:0;left:0;right:0;z-index:var(--z-nav);
  background:rgba(248,249,255,.98);
  border-bottom:1px solid var(--outline-variant);
  padding-top:env(safe-area-inset-top);
}
.header-inner{
  max-width:var(--content-max);margin:0 auto;height:var(--header-h);
  padding:0 var(--space-4);display:flex;align-items:center;
  gap:var(--space-3);justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:36px;height:36px;flex:0 0 36px;border-radius:10px;
  background:var(--primary-container);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
}
.brand-text{min-width:0}
.brand-title-row{display:flex;align-items:center;gap:8px;min-width:0}
.brand h1{
  font-size:var(--text-lg);font-weight:700;letter-spacing:-.015em;
  color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.local-chip{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-full);
  background:var(--surface-container);color:var(--on-surface-variant);
  font-size:10px;font-weight:600;white-space:nowrap;
}
.brand-sub{
  font-size:var(--text-sm);color:var(--on-surface-variant);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
}
.header-actions{display:flex;align-items:center;gap:var(--space-2);flex:0 0 auto}

#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:var(--z-nav);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  background:var(--surface-lowest);border-top:1px solid var(--outline-variant);
  box-shadow:0 -4px 16px rgb(15 23 42 / .05);
}
#nav button{
  flex:1;min-width:0;border:0;background:none;color:var(--on-surface-variant);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:44px;padding:5px 2px;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:10px;font-weight:600;
  transition:color var(--t-fast),background var(--t-fast);
}
#nav button iconify-icon{display:block}
#nav button:hover{color:var(--primary)}
#nav button.active{color:var(--primary);background:var(--surface-low)}

/* ========================================================================== */
/* Contenido                                                                  */
/* ========================================================================== */
.app-main{
  width:100%;max-width:var(--content-max);margin:0 auto;
  padding:calc(var(--header-h) + env(safe-area-inset-top) + 16px) var(--space-4) var(--space-6);
}
.page-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-4);
}
.page-title{font-size:var(--text-3xl);font-weight:700;letter-spacing:-.025em;line-height:var(--leading-tight)}
.page-sub{font-size:var(--text-sm);color:var(--on-surface-variant);margin-top:2px}
.page-actions{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}

/* ========================================================================== */
/* Botones                                                                    */
/* ========================================================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid transparent;border-radius:10px;padding:0 14px;min-height:40px;
  font-family:inherit;font-size:var(--text-md);font-weight:600;line-height:1;
  cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast);
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--surface-low);color:var(--primary);border-color:var(--outline-variant)}
.btn-secondary:hover{background:var(--surface-container)}
.btn-ghost{background:transparent;color:var(--primary);padding:0 8px}
.btn-ghost:hover{background:var(--surface-low)}
.btn-danger{background:var(--error-container);color:var(--error);border-color:var(--error-border)}
.btn-danger:hover{background:var(--error);color:var(--on-error)}
.btn-block{width:100%}
.btn-sm{min-height:32px;padding:0 10px;font-size:var(--text-sm);border-radius:8px}
.icon-btn{
  width:40px;height:40px;min-height:40px;flex:0 0 40px;padding:0;border-radius:10px;
  border:1px solid transparent;background:var(--surface-low);color:var(--on-surface-variant);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background var(--t-fast),color var(--t-fast);
}
.icon-btn:hover{background:var(--surface-container);color:var(--on-surface)}
.icon-btn.btn-sm{width:32px;height:32px;min-height:32px;flex-basis:32px}

/* ========================================================================== */
/* Formularios                                                                */
/* ========================================================================== */
label{display:block;font-size:var(--text-sm);font-weight:600;color:var(--on-surface-variant);margin:0 0 6px}
input,select,textarea{
  width:100%;border:1px solid var(--outline-variant);border-radius:10px;
  background:var(--surface-lowest);color:var(--on-surface);
  padding:10px 12px;font-family:inherit;font-size:var(--text-md);min-height:42px;
  transition:border-color var(--t-fast),box-shadow var(--t-fast);
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgb(37 99 235 / .14);
}
textarea{min-height:84px;resize:vertical}
input[type="color"]{padding:4px;height:46px}
input[type="file"]{padding:8px;font-size:var(--text-sm)}
input[type="file"]::file-selector-button{
  font-family:inherit;font-size:var(--text-sm);font-weight:600;
  border:0;border-radius:8px;background:var(--surface-low);color:var(--primary);
  padding:6px 10px;margin-right:8px;cursor:pointer;
}
input[type="file"]::file-selector-button:hover{background:var(--surface-container)}
input[type="checkbox"],input[type="radio"]{width:auto;min-height:auto;accent-color:var(--primary)}
.field{margin-bottom:var(--space-3)}
.help{font-size:var(--text-sm);color:var(--on-surface-variant);margin-top:6px;line-height:var(--leading-snug)}
.form-grid{display:grid;gap:var(--space-3)}
.form-grid.two{grid-template-columns:1fr}
.form-actions{display:flex;gap:var(--space-2);margin-top:var(--space-4)}
.form-actions>*{flex:1}
@media(min-width:600px){.form-grid.two{grid-template-columns:1fr 1fr}}

/* ========================================================================== */
/* Tarjetas y utilidades                                                      */
/* ========================================================================== */
.card{
  background:var(--surface-lowest);border:1px solid var(--outline-variant);
  border-radius:var(--radius-xl);padding:var(--space-4);box-shadow:var(--shadow-card);
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-3)}
.card-head h3{font-size:var(--text-lg);font-weight:600;letter-spacing:-.01em}
.card h2{font-size:var(--text-xl);font-weight:600;letter-spacing:-.01em}
.card h3{font-size:var(--text-lg);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:var(--space-3)}
.muted{color:var(--on-surface-variant)}
.small{font-size:var(--text-sm)}
.item{padding:var(--space-3) 0;border-bottom:1px solid var(--outline-variant)}
.item:last-child{border-bottom:0}
.item:first-child{padding-top:0}
.empty{text-align:center;padding:var(--space-8) var(--space-4);color:var(--on-surface-variant)}
.empty strong{display:block;color:var(--on-surface);font-size:var(--text-md);margin-bottom:4px}
.empmark{display:inline-flex;align-items:center;gap:8px;min-width:0}
.empmark b{display:block;font-size:var(--text-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 10px}
hr{border:0;border-top:1px solid var(--outline-variant);margin:var(--space-4) 0}
.w-full{width:100%}
.mt-2{margin-top:var(--space-2)}
.mt-3{margin-top:var(--space-3)}
.hidden{display:none!important}

/* ========================================================================== */
/* KPIs y dashboard                                                           */
/* ========================================================================== */
.year-control{
  display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px;
  background:var(--surface-lowest);border:1px solid var(--outline-variant);
  border-radius:10px;color:var(--primary);
}
.year-control .yearpick{
  width:auto;min-height:auto;border:0;border-radius:0;padding:0 4px;
  background:transparent;color:var(--primary);font-weight:700;font-size:var(--text-md);
}
.year-control .yearpick:focus{box-shadow:none}

.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3);margin-bottom:var(--space-4)}
.kpi-card{
  display:flex;flex-direction:column;gap:6px;min-height:104px;
  background:var(--surface-lowest);border:1px solid var(--outline-variant);
  border-radius:var(--radius-xl);padding:var(--space-3);box-shadow:var(--shadow-card);
}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-label{font-size:var(--text-sm);font-weight:600;color:var(--on-surface-variant)}
.kpi-icon{width:30px;height:30px;border-radius:8px;background:var(--surface-low);color:var(--primary);display:flex;align-items:center;justify-content:center}
.kpi-value{font-size:var(--text-4xl);font-weight:700;letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums}
.kpi-hint{font-size:var(--text-xs);color:var(--on-surface-variant)}
.kpi-progress{height:6px;background:var(--surface-container);border-radius:var(--radius-full);overflow:hidden;margin-top:4px}
.kpi-progress>span{display:block;height:100%;background:var(--primary);border-radius:var(--radius-full)}

.dashboard-grid{display:grid;grid-template-columns:1fr;gap:var(--space-3);margin-bottom:var(--space-4)}
.bar-row{margin:10px 0}
.bar-row:first-child{margin-top:0}
.bar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--text-sm);margin-bottom:5px}
.bar-head .bar-label{display:inline-flex;align-items:center;gap:6px}
.bar-head b{font-variant-numeric:tabular-nums}
.bar-track{height:8px;background:var(--surface-container);border-radius:var(--radius-full);overflow:hidden}
.bar-fill{height:100%;border-radius:var(--radius-full);transition:width var(--t-normal)}
.monthchart{display:flex;align-items:flex-end;gap:6px;height:112px;margin-top:var(--space-3)}
.month-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.month-col .mbar{width:100%;min-height:3px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#3b82f6,var(--primary));transition:height var(--t-normal)}
.month-col .mval{font-size:10px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.month-col .mlbl{font-size:10px;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;font-size:var(--text-md)}
.data-table th{
  text-align:left;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.04em;
  color:var(--on-surface-variant);font-weight:700;padding:8px 10px;
  border-bottom:1px solid var(--outline-variant);white-space:nowrap;
}
.data-table td{padding:10px;border-bottom:1px solid var(--outline-variant);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tbody tr:hover{background:var(--surface-low)}
.data-table .num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}

/* ========================================================================== */
/* Pills                                                                      */
/* ========================================================================== */
.pill{
  display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;
  border-radius:var(--radius-full);padding:3px 9px;
  font-size:var(--text-xs);font-weight:700;white-space:nowrap;
}
.pill.vac{color:var(--vac);background:var(--vac-bg);border-color:var(--vac-border)}
.pill.baja{color:var(--baja);background:var(--baja-bg);border-color:var(--baja-border)}
.pill.med{color:var(--visita);background:var(--visita-bg);border-color:var(--visita-border)}
.pill.other{color:var(--permiso);background:var(--permiso-bg);border-color:var(--permiso-border)}

/* ========================================================================== */
/* Empleados                                                                  */
/* ========================================================================== */
.employee-grid{display:grid;grid-template-columns:1fr;gap:var(--space-3)}
.employee-card{display:flex;flex-direction:column;gap:10px}
.employee-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.count-badge{
  display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;
  padding:0 8px;border-radius:var(--radius-full);background:var(--surface-container);
  color:var(--on-surface-variant);font-size:var(--text-xs);font-weight:700;white-space:nowrap;
}
.balance-line{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:10px;background:var(--surface-low);font-size:var(--text-sm);
}
.balance-line b{font-size:var(--text-lg);color:var(--primary);font-variant-numeric:tabular-nums}
.mini-breakdown{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:var(--text-sm);color:var(--on-surface-variant)}
.mini-breakdown span{white-space:nowrap}
.employee-card .btn-block{margin-top:auto}

/* ========================================================================== */
/* Barra de búsqueda y filtros                                                */
/* ========================================================================== */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.search-field{position:relative;flex:1;min-width:180px;display:flex;align-items:center}
.search-field iconify-icon{position:absolute;left:12px;color:var(--outline);pointer-events:none}
.search-field input{padding-left:38px}
.toolbar select{width:auto;min-width:130px}
.filter-empty{display:none;text-align:center;padding:var(--space-5);color:var(--on-surface-variant);font-size:var(--text-md)}

/* ========================================================================== */
/* Calendario                                                                 */
/* ========================================================================== */
.calendar-layout{display:grid;grid-template-columns:1fr;gap:var(--space-3)}
.calendar-card{padding:var(--space-3)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-3)}
.monthbar strong{font-size:var(--text-xl);font-weight:600;letter-spacing:-.01em}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calendar>*{min-width:0}
.dayname{text-align:center;font-size:10px;font-weight:700;color:var(--on-surface-variant);padding:4px 0;text-transform:uppercase;letter-spacing:.03em}
.day{
  min-height:56px;background:var(--surface-lowest);border:1px solid var(--outline-variant);
  border-radius:8px;padding:4px;position:relative;cursor:pointer;overflow:hidden;
  transition:background var(--t-fast),border-color var(--t-fast),box-shadow var(--t-fast);
}
.day:hover{background:var(--surface-low)}
.day.dim{opacity:.3;pointer-events:none}
.day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.day.selected{background:var(--primary-container);border-color:var(--primary)}
.day.guardday{background:var(--guardia-bg);border-color:var(--guardia-border)}
.day-num{position:absolute;top:4px;left:6px;font-size:var(--text-sm);font-weight:700;color:var(--on-surface);font-variant-numeric:tabular-nums}
.day.today .day-num{color:var(--primary)}
.day.selected .day-num{color:var(--on-primary-container)}
.day-count{position:absolute;top:5px;right:6px;font-size:9px;font-weight:700;color:var(--primary)}
.day-dots{position:absolute;left:5px;bottom:5px;right:5px;display:flex;flex-wrap:wrap;gap:2px}
.day-dots .empdot{width:6px;height:6px;flex:0 0 6px}
.guardtag{
  position:absolute;right:4px;bottom:4px;display:inline-block;
  background:var(--guardia);color:#fff;border-radius:var(--radius-full);
  padding:1px 5px;font-size:7px;font-weight:700;letter-spacing:.03em;line-height:1.4;
}
.day.guardday .day-dots{bottom:16px;right:5px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:var(--space-3);font-size:var(--text-xs);color:var(--on-surface-variant)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .guard-swatch{width:12px;height:12px;border-radius:3px;background:var(--guardia-bg);border:1px solid var(--guardia-border)}

  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

function buildStateCSV(state){
  const rows = [['tipo', 'id', 'datos_json']];
  (state.employees || []).forEach((x) => rows.push(['empleado', x.id, JSON.stringify(x)]));
  (state.records || []).forEach((x) => rows.push(['registro', x.id, JSON.stringify(x)]));
  (state.workDays || []).forEach((x) => rows.push(['refuerzo', x.id, JSON.stringify(x)]));
  rows.push(['ajustes', '', JSON.stringify(state.settings)]);
  return '\ufeff' + rows.map((r) => r.map(csvCell).join(';')).join('\r\n');

function parseCSV(text){

function saveGuardSettings(){
  const state = getState();
  const everyDays = Number($('#guardEvery').value);
  const durationDays = Number($('#guardDuration').value);
  const anchor = $('#guardAnchor').value;
  if (!Number.isInteger(everyDays) || everyDays < 1 || everyDays > 366 || !Number.isInteger(durationDays) || durationDays < 1 || durationDays > 31 || !anchor) {
    toast('Revisa la frecuencia, duración y fecha de inicio');
    return;
  }
  state.settings.guards = normalizeGuards({ enabled: $('#guardsEnabled').value === 'yes', everyDays, durationDays, anchor });

  window.app.render();
  toast('Guardias informativas guardadas');
}

function saveSettings(){
  const state = getState();
  const n = Number($('#annual').value);
  const h = $('#holidays').value.split(/\n/).map((x) => x.trim()).filter(Boolean);

  window.app.render();

}

function restoreDefaultHolidays(){

function loadCSVBackup(){

function createReportImages(){
  const screen = $('#reportScreen');
  const paper = screen.querySelector('.report-paper');
  if (!paper) { toast('Primero genera el informe'); return; }
  const toolbar = screen.querySelector('.report-toolbar');
  const old = screen.querySelector('.image-pages');
  if (old) old.remove();

  const pages = document.createElement('div');
  pages.className = 'image-pages';
  const help = document.createElement('div');
  help.className = 'image-help';
  help.innerHTML = '<b>Cómo guardar en iPhone:</b> mantén pulsada cada imagen y elige «Guardar en Fotos» o «Guardar en Archivos». En ordenador puedes hacer clic derecho y guardar la imagen.';

  const W = 1240;
  const H = 1754;
  const M = 88;
  const CONTENT = W - M * 2;
  let canvas;
  let ctx;
  let y;
  let pageNo = 0;

  function newPage(){
    canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    y = 110;
    pageNo++;
    ctx.fillStyle = '#1e40af';
    ctx.fillRect(0, 0, W, 18);
    ctx.fillStyle = '#0b1c30';
    ctx.font = 'bold 48px Inter, Arial';
    ctx.fillText('Informe de ausencias', M, y);
    y += 58;
    ctx.fillStyle = '#424752';
    ctx.font = '26px Inter, Arial';
    const meta = (paper.querySelector('p')?.innerText || '').replace(/\n/g, ' · ');
    drawWrapped(meta, M, y, CONTENT, 36);
    y += 82;
  }

  function drawWrapped(text, x, yy, maxWidth, lineH, font = '26px Inter, Arial', color = '#0b1c30'){
    ctx.font = font;
    ctx.fillStyle = color;
    const words = String(text || '').split(/\s+/);
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) { ctx.fillText(line, x, yy); yy += lineH; line = word; }
      else line = test;
    }
    if (line) { ctx.fillText(line, x, yy); yy += lineH; }
    return yy;
  }

  function addEmployee(title){
    if (y > H - 220) { finishPage(); newPage(); }
    ctx.fillStyle = '#eff4ff';
    ctx.fillRect(M, y - 38, CONTENT, 54);
    ctx.fillStyle = '#1e40af';
    ctx.font = 'bold 31px Inter, Arial';
    ctx.fillText(title, M + 18, y);
    y += 54;
  }

  function addRecord(cells){
    const labels = ['Tipo', 'Fecha(s)', 'Duración', 'Observaciones'];
    const lines = [];
    for (let i = 0; i < cells.length; i++) {
      const val = (cells[i] || '—').replace(/\s+/g, ' ').trim();
      ctx.font = 'bold 23px Inter, Arial';
      const prefix = labels[i] + ': ';
      ctx.fillStyle = '#424752';
      const line = prefix + val;
      const wrap = [];
      const words = line.split(/\s+/);
      let cur = '';
      ctx.font = '23px Inter, Arial';
      for (const w of words) {
        const t = cur ? cur + ' ' + w : w;
        if (ctx.measureText(t).width > CONTENT - 54 && cur) { wrap.push(cur); cur = w; }
        else cur = t;
      }
      if (cur) wrap.push(cur);
      lines.push(...wrap);
    }
    const h = lines.length * 34 + 30;
    if (y + h > H - 105) { finishPage(); newPage(); }
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#c2c6d4';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(M, y, CONTENT, h, 12);
    ctx.fill();
    ctx.stroke();
    let yy = y + 36;
    ctx.font = '23px Inter, Arial';
    ctx.fillStyle = '#0b1c30';
    for (const line of lines) { ctx.fillText(line, M + 18, yy); yy += 34; }
    y += h + 14;
  }

  function finishPage(){
    ctx.fillStyle = '#424752';
    ctx.font = '20px Inter, Arial';
    ctx.fillText('Control de ausencias', M, H - 45);
    ctx.textAlign = 'right';
    ctx.fillText('Página ' + pageNo, W - M, H - 45);
    ctx.textAlign = 'left';
    const img = document.createElement('img');
    img.className = 'image-page';
    img.alt = 'Informe de ausencias, página ' + pageNo;
    img.src = canvas.toDataURL('image/png');
    img.draggable = false;
    pages.appendChild(img);
  }

  newPage();
  const sections = [...paper.querySelectorAll('.report-group')];
  for (const section of sections) {
    const heading = section.querySelector('h3')?.innerText || 'Empleado';
    addEmployee(heading);
    const rows = [...section.querySelectorAll('tbody tr')];
    if (!rows.length) { addRecord(['', 'Sin ausencias en los años seleccionados', '', '']); continue; }
    for (const tr of rows) addRecord([...tr.children].map((td) => td.innerText));
  }

  const calSection=paper.querySelector('.report-calendar-section');
  if(calSection){
    if(y>H-560){finishPage();newPage();}
    addEmployee(calSection.querySelector('h2')?.innerText||'Calendario');
    const calDays=[...calSection.querySelectorAll('.report-cal-day')];
    const colW=CONTENT/7, cellH=145, gridY=y;
    const headers=['L','M','X','J','V','S','D'];
    ctx.font='bold 20px Inter, Arial';ctx.fillStyle='#334155';
    headers.forEach((h,i)=>ctx.fillText(h,M+i*colW+colW/2-5,gridY+20));
    let idx=0; for(let row=0;row<Math.ceil(calDays.length/7);row++){
      for(let col=0;col<7;col++){
        const node=calDays[idx++]; if(!node)continue;
        const x=M+col*colW, yy=gridY+34+row*cellH;
        if(!node.classList.contains('empty')){ctx.fillStyle='#fff';ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;ctx.fillRect(x,yy,colW-4,cellH-5);ctx.strokeRect(x,yy,colW-4,cellH-5);ctx.fillStyle='#0f172a';ctx.font='bold 18px Inter, Arial';ctx.fillText(node.querySelector('.n')?.innerText||'',x+6,yy+22);let ey=yy+42;for(const ev of [...node.querySelectorAll('.report-cal-event')].slice(0,5)){ctx.font='13px Inter, Arial';ctx.fillStyle='#334155';const txt=ev.innerText;const max=colW-16;let line='';for(const word of txt.split(/\s+/)){const t=line?line+' '+word:word;if(ctx.measureText(t).width>max&&line){ctx.fillText(line,x+7,ey);ey+=16;line=word;}else line=t;}if(line&&ey<yy+cellH-10){ctx.fillText(line,x+7,ey);ey+=16;}}}
      }
    }
    y=gridY+34+Math.ceil(calDays.length/7)*cellH+20;
    const leg=calSection.querySelector('.report-cal-legend');if(leg)y=drawWrapped(leg.innerText,M,y,CONTENT,24,'18px Inter, Arial','#424752')+10;
    const summary=calSection.querySelector('.report-summary-table');if(summary){if(y>H-260){finishPage();newPage();}for(const tr of [...summary.querySelectorAll('tr')]){const vals=[...tr.children].map(td=>td.innerText).join('   |   ');y=drawWrapped(vals,M,y,CONTENT,24,'16px Inter, Arial','#1f2937')+4;}}
  }

  const footer = paper.querySelector('p.small')?.innerText;
  if (footer) {
    if (y > H - 180) { finishPage(); newPage(); }
    drawWrapped(footer, M, y, CONTENT, 30, '21px Inter, Arial', '#424752');
  }
  finishPage();
  screen.insertBefore(help, toolbar.nextSibling);
  screen.insertBefore(pages, help.nextSibling);
  pages.scrollIntoView({ behavior: 'smooth', block: 'start' });
  toast('Imágenes creadas. Mantén pulsada una para guardarla.');
}

  $('#reportScreen').classList.remove('show');
