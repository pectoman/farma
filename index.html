<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ausencias">
<link rel="manifest" href="manifest.webmanifest">
<title>Control de ausencias</title>
<style>
:root{--navy:#17324d;--blue:#2d6cdf;--bg:#f3f6fa;--card:#fff;--muted:#64748b;--line:#e3e9f0;--green:#198754;--orange:#d97706;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172536;padding-bottom:88px}
header{background:var(--navy);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0 0 4px}header p{margin:0;color:#cbd7e4;font-size:12px}
main{max-width:760px;margin:auto;padding:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:20px;font-weight:500}nav button.active{color:var(--blue);font-weight:700}
h2{font-size:18px;margin:8px 0 12px}.muted{color:var(--muted)}.small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px;box-shadow:0 2px 8px #1c35500a}
.stat .num{font-size:26px;font-weight:750;color:var(--navy);margin-top:5px}.stat .lbl{font-size:12px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}
button,.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:11px 14px;font-weight:650;font-size:14px;cursor:pointer}
button.secondary{background:#eaf0f8;color:var(--navy)}button.danger{background:#fff0ef;color:var(--red)}button.ghost{background:transparent;color:var(--blue);padding:6px}
input,select,textarea{width:100%;border:1px solid #ccd6e2;border-radius:10px;padding:11px;font:inherit;background:#fff;color:#172536}
label{display:block;font-size:12px;color:var(--muted);font-weight:650;margin:10px 0 5px}
form .actions{display:flex;gap:8px;margin-top:15px}form .actions>*{flex:1}
.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;background:#edf2f7;color:#43566b}
.pill.vac{background:#e7f0ff;color:#2458ae}.pill.baja{background:#ffebe8;color:#b43c2e}.pill.med{background:#fff3d9;color:#98600b}.pill.other{background:#e9f7ef;color:#187347}
.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.monthbar strong{font-size:17px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dayname{text-align:center;font-size:10px;color:var(--muted);padding:5px 0}
.day{min-height:58px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:11px;position:relative}
.day.dim{opacity:.35}.day.today{border:2px solid var(--blue)}.day .count{display:block;font-size:9px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.guardtag{display:inline-block;background:#fee2e2;color:#991b1b;border-radius:99px;padding:3px 7px;font-size:9px;font-weight:700;margin-top:4px}.day.guardday{background:#fee2e2;border-color:#ef9a9a;color:#991b1b}.day.guardday .count{color:#2458ae;font-weight:700}
.modal{position:fixed;inset:0;background:#10203388;z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}.sheet{background:var(--bg);width:100%;max-width:650px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#172536;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:30;font-size:13px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
</style>
</head>
<body>
<header><div class="row" style="align-items:center"><div><h1>Control de ausencias</h1><p>Gestión local de vacaciones, bajas y visitas médicas</p></div><button class="secondary" style="background:#fff;color:var(--navy);white-space:nowrap;padding:9px 11px" onclick="saveCSVBackup()">Guardar CSV</button></div></header>
<main id="app"></main>
<nav id="nav">
<button data-tab="inicio" class="active"><b>⌂</b>Inicio</button>
<button data-tab="empleados"><b>♙</b>Empleados</button>
<button data-tab="calendario"><b>▦</b>Calendario</button>
<button data-tab="registros"><b>☷</b>Registros</button>
<button data-tab="ajustes"><b>⚙</b>Ajustes</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const DB='ausencias_local_v1';
let state={employees:[],records:[],settings:{annualDays:22,workweek:'monfri',holidays:[],year:new Date().getFullYear(),guards:{enabled:true,every:3,durationWeeks:1,anchor:'2026-11-16'}}};
let tab='inicio', calDate=new Date();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
function save(){try{localStorage.setItem(DB,JSON.stringify(state));}catch(e){toast('No se pudo guardar en el almacenamiento del iPhone. Exporta una copia CSV.');}}
function load(){try{const x=JSON.parse(localStorage.getItem(DB));if(x&&Array.isArray(x.employees)&&Array.isArray(x.records)){state=x;state.settings=state.settings||{};state.settings.annualDays??=22;state.settings.holidays??=[];state.settings.guards??={enabled:true,every:3,durationWeeks:1,anchor:'2026-11-16'};state.settings.guards={enabled:true,every:3,durationWeeks:1,anchor:'2026-11-16',...state.settings.guards};}}catch(e){}}
function toast(t){let el=$('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
function emp(id){return state.employees.find(e=>e.id===id)}
function workingDays(start,end){let n=0,d=new Date(start+'T12:00:00'),last=new Date(end+'T12:00:00');while(d<=last){let wd=d.getDay(),key=iso(d);if(wd!==0&&wd!==6&&!state.settings.holidays.includes(key))n++;d.setDate(d.getDate()+1)}return n}
function recordDays(r){if(r.unit==='hours')return 0;if(r.type==='vacaciones')return Number(r.daysOverride||workingDays(r.start,r.end));return 0}
function usedVac(id,year){return state.records.filter(r=>r.employeeId===id&&r.type==='vacaciones'&&r.start.slice(0,4)==String(year)).reduce((a,r)=>a+recordDays(r),0)}
function balance(e,year){return Number(e.entitlement??state.settings.annualDays)+Number(e.carry||0)-usedVac(e.id,year)}
function typeLabel(t){return ({vacaciones:'Vacaciones',baja:'Baja médica',medica:'Visita médica',otro:'Otro permiso'})[t]||t}
function pill(t){return `<span class="pill ${t==='vacaciones'?'vac':t==='baja'?'baja':t==='medica'?'med':'other'}">${typeLabel(t)}</span>`}
function render(){
 $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const app=$('#app'); if(tab==='inicio')app.innerHTML=home();if(tab==='empleados')app.innerHTML=employeesView();if(tab==='calendario')app.innerHTML=calendarView();if(tab==='registros')app.innerHTML=recordsView();if(tab==='ajustes')app.innerHTML=settingsView();
}
function home(){
 const y=new Date().getFullYear(), active=state.records.filter(r=>r.start<=iso(new Date())&&r.end>=iso(new Date())).length;
 const total=state.employees.reduce((a,e)=>a+Math.max(0,balance(e,y)),0);
 let upcoming=state.records.filter(r=>r.start>=iso(new Date())).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,5);
 return `<h2>Resumen · ${y}</h2><div class="grid">
 <div class="card stat"><div class="lbl">Empleados</div><div class="num">${state.employees.length}</div></div>
 <div class="card stat"><div class="lbl">Ausencias activas</div><div class="num">${active}</div></div>
 <div class="card stat"><div class="lbl">Días disponibles*</div><div class="num">${total}</div></div>
 <div class="card stat"><div class="lbl">Registros este año</div><div class="num">${state.records.filter(r=>r.start.startsWith(String(y))).length}</div></div></div>
 <p class="small muted">*Suma de saldos positivos de vacaciones de todos los empleados.</p>
 <div class="row"><h2>Próximas ausencias</h2><button class="secondary" onclick="go('registros')">Ver todas</button></div>
 <div class="card">${upcoming.length?upcoming.map(r=>`<div class="item"><div class="row"><b>${esc(emp(r.employeeId)?.name||'Empleado eliminado')}</b>${pill(r.type)}</div><div class="small muted">${fmt(r.start)} – ${fmt(r.end)}${r.type==='vacaciones'?' · '+recordDays(r)+' días':''}</div></div>`).join(''):'<div class="empty">Todavía no hay ausencias futuras.</div>'}</div>
 <button style="width:100%" onclick="openRecord()">＋ Añadir ausencia</button>`;
}
function employeesView(){return `<div class="row"><h2>Empleados</h2><button onclick="openEmployee()">＋ Añadir</button></div>
 ${state.employees.length?state.employees.map(e=>`<div class="card"><div class="row"><div><b>${esc(e.name)}</b><div class="small muted">${esc(e.department||'Sin departamento')}</div></div><div style="text-align:right"><b>${balance(e,new Date().getFullYear())}</b><div class="small muted">días disponibles</div></div></div><div class="row" style="margin-top:10px"><span class="small muted">Anuales: ${e.entitlement??state.settings.annualDays} · Arrastre: ${e.carry||0}</span><button class="secondary" onclick="openEmployee('${e.id}')">Ver / editar</button></div></div>`).join(''):'<div class="card empty">Añade el primer empleado para empezar.</div>'}`;}
function isGuardDate(dateStr){const g=state.settings.guards||{};if(g.enabled===false||!g.anchor)return false;const date=new Date(dateStr+'T12:00:00'),anchor=new Date(g.anchor+'T12:00:00');const monday=d=>{let x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(12,0,0,0);return x};const diff=Math.floor((monday(date)-monday(anchor))/604800000);const every=Math.max(1,Number(g.every||3)),duration=Math.max(1,Number(g.durationWeeks||1));return diff>=0&&(diff%every)<duration;}
function calendarView(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells='';['L','M','X','J','V','S','D'].forEach(x=>cells+=`<div class="dayname">${x}</div>`);for(let i=0;i<offset;i++)cells+=`<div class="day dim"></div>`;let guardDates=[];for(let d=1;d<=days;d++){let date=iso(new Date(y,m,d)),rs=state.records.filter(r=>r.start<=date&&r.end>=date),guard=isGuardDate(date),today=date===iso(new Date());if(guard)guardDates.push(date);cells+=`<div class="day ${guard?'guardday':''} ${today?'today':''}"><b>${d}</b>${rs.length?`<span class="count">${rs.length} aus.</span>`:''}${guard?`<span class="guardtag">GUARDIA</span>`:''}</div>`}let monthRecords=state.records.filter(r=>r.start.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`||r.end.slice(0,7)===`${y}-${String(m+1).padStart(2,'0')}`).sort((a,b)=>a.start.localeCompare(b.start));let runs=[];guardDates.forEach(ds=>{let last=runs[runs.length-1];if(last&&new Date(ds+'T12:00:00')-new Date(last.end+'T12:00:00')===86400000)last.end=ds;else runs.push({start:ds,end:ds})});return `<h2>Calendario mensual</h2><div class="card"><div class="monthbar"><button class="secondary" onclick="changeMonth(-1)">‹</button><strong>${new Date(y,m,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</strong><button class="secondary" onclick="changeMonth(1)">›</button></div><div class="calendar">${cells}</div><div class="small muted" style="margin-top:10px">Rojo: días de guardia (informativos) · Azul: ausencias registradas. Las guardias no afectan a empleados ni al registro de ausencias.</div></div><h2>Ausencias del mes</h2><div class="card">${monthRecords.map(r=>`<div class="item"><div class="row"><b>${esc(emp(r.employeeId)?.name||'Empleado')}</b>${pill(r.type)}</div><div class="small muted">${fmt(r.start)} – ${fmt(r.end)}</div></div>`).join('')||'<div class="empty">Sin registros este mes.</div>'}</div><h2>Guardias informativas del mes</h2><div class="card">${runs.map(x=>`<div class="item"><b>${fmt(x.start)}${x.start!==x.end?' – '+fmt(x.end):''}</b></div>`).join('')||'<div class="empty">No hay días de guardia este mes.</div>'}</div>`;}
function recordsView(){let rs=[...state.records].sort((a,b)=>b.start.localeCompare(a.start));return `<div class="row"><h2>Registros</h2><button onclick="openRecord()">＋ Añadir</button></div>
 <div class="card">${rs.length?rs.map(r=>`<div class="item"><div class="row"><b>${esc(emp(r.employeeId)?.name||'Empleado eliminado')}</b>${pill(r.type)}</div><div class="small muted">${fmt(r.start)} – ${fmt(r.end)}${r.type==='vacaciones'?' · '+recordDays(r)+' días':r.type==='medica'?' · '+esc(r.duration||'') :''}</div>${r.notes?`<div class="small">${esc(r.notes)}</div>`:''}<div class="row" style="justify-content:flex-end"><button class="ghost" onclick="openRecord('${r.id}')">Editar</button><button class="ghost" onclick="deleteRecord('${r.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">No hay registros todavía.</div>'}</div>`;
}
function settingsView(){let g=state.settings.guards||{enabled:true,every:3,durationWeeks:1,anchor:'2026-11-16'};return `<h2>Ajustes</h2><div class="card"><h3>Guardias informativas</h3><p class="small muted">Se muestran en rojo en el calendario. No se asignan a empleados y no modifican vacaciones, permisos ni ausencias.</p><label>Mostrar guardias</label><select id="guardsEnabled"><option value="yes" ${g.enabled!==false?'selected':''}>Sí</option><option value="no" ${g.enabled===false?'selected':''}>No</option></select><label>Frecuencia (cada cuántas semanas)</label><input id="guardEvery" type="number" min="1" max="52" value="${g.every||3}"><label>Duración (semanas completas)</label><input id="guardDuration" type="number" min="1" max="7" value="${g.durationWeeks||1}"><label>Inicio de la primera semana de guardia (lunes)</label><input id="guardAnchor" type="date" value="${g.anchor||'2026-11-16'}"><p class="small muted">Configuración inicial: una semana completa de lunes a domingo, cada 3 semanas, comenzando el 16/11/2026.</p><button style="width:100%;margin-top:12px" onclick="saveGuardSettings()">Guardar guardias</button></div><div class="card"><h3>Vacaciones por defecto</h3><label>Días laborables anuales</label><input id="annual" type="number" min="0" max="365" value="${state.settings.annualDays}"><label>Festivos (uno por línea, formato AAAA-MM-DD)</label><textarea id="holidays" rows="5" placeholder="2026-01-01">${state.settings.holidays.join('\n')}</textarea><button style="width:100%;margin-top:12px" onclick="saveSettings()">Guardar ajustes</button></div>
 <div class="card"><h3>Guardar y cargar datos CSV</h3><p class="small muted">Pulsa «Guardar CSV» en la cabecera después de realizar cambios. En iPhone se abrirá la hoja de compartir para elegir «Guardar en Archivos». El CSV contiene empleados, ausencias y ajustes para poder recuperar toda la aplicación.</p><button style="width:100%;margin-bottom:8px" onclick="saveCSVBackup()">Guardar copia CSV en Archivos</button><label>Cargar una copia CSV desde Archivos</label><input type="file" id="stateCSVFile" accept=".csv,text/csv"><button class="secondary" style="width:100%;margin-top:8px" onclick="loadCSVBackup()">Cargar / restaurar CSV</button><p class="small muted">Al cargar una copia se sustituirán los datos actuales. La app también conserva una copia automática en el almacenamiento local del navegador de este iPhone y la carga al abrirse.</p><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h3>Copia JSON adicional</h3><button class="secondary" style="width:100%;margin-bottom:8px" onclick="backup()">Exportar copia JSON</button><label>Restaurar copia JSON</label><input type="file" id="restoreFile" accept=".json,application/json"><button class="secondary" style="width:100%;margin-top:8px" onclick="restore()">Restaurar datos JSON</button></div>
 <div class="card"><h3>Exportar informes</h3><button style="width:100%;margin-bottom:8px" onclick="exportCSV()">Exportar registros a Excel (CSV)</button><button class="secondary" style="width:100%" onclick="printReport()">Informe imprimible / PDF</button></div>
 <p class="small muted">Los datos se guardan en este navegador y en este iPhone. No se envían a ningún servidor. La eliminación de datos del navegador puede borrarlos; conserva copias externas.</p>`;}
function saveGuardSettings(){let every=Number($('#guardEvery').value),duration=Number($('#guardDuration').value),anchor=$('#guardAnchor').value;if(!Number.isInteger(every)||every<1||every>52||!Number.isInteger(duration)||duration<1||duration>7||!anchor){toast('Revisa la frecuencia, duración y fecha de inicio');return}state.settings.guards={enabled:$('#guardsEnabled').value==='yes',every,durationWeeks:duration,anchor};save();render();toast('Guardias informativas guardadas')}
function go(t){tab=t;render()}
function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);render()}
function modal(content){$('#sheet').innerHTML=content;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openEmployee(id=''){let e=emp(id)||{name:'',department:'',entitlement:state.settings.annualDays,carry:0};modal(`<div class="row"><h2>${id?'Editar empleado':'Nuevo empleado'}</h2><button class="ghost" onclick="closeModal()">Cerrar</button></div><form onsubmit="saveEmployee(event,'${id}')"><label>Nombre y apellidos *</label><input name="name" required value="${esc(e.name)}"><label>Departamento / equipo</label><input name="department" value="${esc(e.department)}"><label>Días laborables de vacaciones al año</label><input name="entitlement" type="number" min="0" step=".5" value="${e.entitlement}"><label>Días pendientes de años anteriores</label><input name="carry" type="number" step=".5" value="${e.carry||0}"><div class="actions"><button type="submit">Guardar empleado</button>${id?`<button type="button" class="danger" onclick="deleteEmployee('${id}')">Eliminar</button>`:''}</div></form>`);}
function saveEmployee(ev,id){ev.preventDefault();let f=new FormData(ev.target);let old=id?emp(id):null;let v={id:id||crypto.randomUUID(),name:f.get('name').trim(),department:f.get('department').trim(),entitlement:Number(f.get('entitlement')),carry:Number(f.get('carry'))};if(id)state.employees=state.employees.map(x=>x.id===id?{...old,...v}:x);else state.employees.push(v);save();closeModal();render();toast('Empleado guardado')}
function deleteEmployee(id){if(!confirm('¿Eliminar empleado? Sus registros también se eliminarán.'))return;state.employees=state.employees.filter(e=>e.id!==id);state.records=state.records.filter(r=>r.employeeId!==id);save();closeModal();render();toast('Empleado eliminado')}
function openRecord(id=''){
 if(!state.employees.length){toast('Primero añade un empleado');go('empleados');return}
 let r=state.records.find(x=>x.id===id)||{employeeId:state.employees[0].id,type:'vacaciones',start:iso(new Date()),end:iso(new Date()),duration:'',notes:''};
 modal(`<div class="row"><h2>${id?'Editar registro':'Nueva ausencia'}</h2><button class="ghost" onclick="closeModal()">Cerrar</button></div>
 <form onsubmit="saveRecord(event,'${id}')"><label>Empleado *</label><select name="employeeId">${state.employees.map(e=>`<option value="${e.id}" ${e.id===r.employeeId?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
 <label>Tipo de ausencia</label><select name="type" id="rtype" onchange="toggleDuration()">${[['vacaciones','Vacaciones'],['baja','Baja médica'],['medica','Visita médica'],['otro','Otro permiso']].map(([v,l])=>`<option value="${v}" ${r.type===v?'selected':''}>${l}</option>`).join('')}</select>
 <label>Fecha inicial *</label><input name="start" type="date" required value="${r.start}"><label>Fecha final *</label><input name="end" type="date" required value="${r.end}">
 <div id="durationWrap"><label>Duración de visita médica</label><input name="duration" placeholder="Ej. 2 horas o jornada completa" value="${esc(r.duration||'')}"></div>
 <label>Observaciones (evita incluir diagnósticos médicos)</label><textarea name="notes" rows="2">${esc(r.notes||'')}</textarea>
 <div class="small muted" id="calcPreview"></div><div class="actions"><button type="submit">Guardar registro</button>${id?`<button type="button" class="danger" onclick="deleteRecord('${id}')">Eliminar</button>`:''}</div></form>`);
 toggleDuration();
}
function toggleDuration(){let t=$('#rtype')?.value;let w=$('#durationWrap');if(w)w.style.display=t==='medica'?'block':'none'}
function saveRecord(ev,id){ev.preventDefault();let f=new FormData(ev.target),start=f.get('start'),end=f.get('end');if(end<start){toast('La fecha final no puede ser anterior');return}
 let v={id:id||crypto.randomUUID(),employeeId:f.get('employeeId'),type:f.get('type'),start,end,duration:f.get('duration').trim(),notes:f.get('notes').trim()};
 if(v.type==='vacaciones'){v.daysOverride=workingDays(start,end);if(v.daysOverride===0){toast('El periodo no contiene días laborables');return}}
 if(id)state.records=state.records.map(x=>x.id===id?v:x);else state.records.push(v);save();closeModal();render();toast('Registro guardado')}
function deleteRecord(id){if(!confirm('¿Eliminar este registro?'))return;state.records=state.records.filter(r=>r.id!==id);save();closeModal();render();toast('Registro eliminado')}
function saveSettings(){let n=Number($('#annual').value),h=$('#holidays').value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(!Number.isFinite(n)||n<0){toast('Número de días no válido');return}if(h.some(x=>!/^\d{4}-\d{2}-\d{2}$/.test(x))){toast('Revisa el formato de los festivos');return}state.settings.annualDays=n;state.settings.holidays=[...new Set(h)];save();render();toast('Ajustes guardados')}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function backup(){download('copia-control-ausencias-'+iso(new Date())+'.json',JSON.stringify(state,null,2),'application/json')}
function restore(){let file=$('#restoreFile').files[0];if(!file){toast('Selecciona un archivo JSON');return}let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!Array.isArray(x.employees)||!Array.isArray(x.records)||!x.settings)throw 0;if(!confirm('La restauración sustituirá los datos actuales. ¿Continuar?'))return;state=x;state.settings.guards??={enabled:true,every:3,durationWeeks:1,anchor:'2026-11-16'};save();render();toast('Copia restaurada')}catch(e){toast('Archivo de copia no válido')}};rd.readAsText(file)}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
// CSV de respaldo completo: una fila por empleado, registro y configuración.
function buildStateCSV(){let rows=[['tipo','id','datos_json']];state.employees.forEach(x=>rows.push(['empleado',x.id,JSON.stringify(x)]));state.records.forEach(x=>rows.push(['registro',x.id,JSON.stringify(x)]));rows.push(['ajustes','',JSON.stringify(state.settings)]);return '\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')}
async function saveCSVBackup(){const filename='control-ausencias-respaldo.csv',csv=buildStateCSV(),blob=new Blob([csv],{type:'text/csv;charset=utf-8'});try{const file=new File([blob],filename,{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'Copia de seguridad del control de ausencias'});toast('Elige «Guardar en Archivos» para conservar el CSV');return}}catch(e){if(e&&e.name==='AbortError')return;}download(filename,csv,'text/csv;charset=utf-8');toast('CSV preparado. En iPhone, guárdalo desde Compartir / Archivos')}
function parseCSV(text){let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===';'){row.push(field);field=''}else if(c==='\n'){row.push(field);rows.push(row);row=[];field=''}else if(c!=='\r')field+=c}if(field.length||row.length){row.push(field);rows.push(row)}return rows}
function loadCSVBackup(){let file=$('#stateCSVFile')?.files?.[0];if(!file){toast('Selecciona primero un CSV desde Archivos');return}let rd=new FileReader();rd.onload=()=>{try{let rows=parseCSV(String(rd.result||'').replace(/^\ufeff/,''));if(rows[0]?.[0]!=='tipo'||rows[0]?.[2]!=='datos_json')throw Error('Formato');let employees=[],records=[],settings=null;for(const r of rows.slice(1)){if(!r[0])continue;let value=JSON.parse(r[2]||'null');if(r[0]==='empleado')employees.push(value);else if(r[0]==='registro')records.push(value);else if(r[0]==='ajustes')settings=value}if(!settings||!Array.isArray(employees)||!Array.isArray(records))throw Error('Datos incompletos');if(!confirm('La carga del CSV sustituirá empleados, ausencias y ajustes actuales. ¿Continuar?'))return;state={employees,records,settings};state.settings.guards??={enabled:true,every:3,durationWeeks:1,anchor:'2026-11-16'};save();render();toast('Datos CSV cargados correctamente')}catch(e){toast('No se reconoce el CSV o está incompleto')}};rd.readAsText(file,'UTF-8')}
function exportCSV(){let rows=[['Empleado','Departamento','Tipo','Fecha inicio','Fecha fin','Días laborables vacaciones','Duración visita','Observaciones']];state.records.forEach(r=>{let e=emp(r.employeeId);rows.push([e?.name,e?.department,typeLabel(r.type),r.start,r.end,r.type==='vacaciones'?recordDays(r):'',r.duration,r.notes])});download('registros-ausencias.csv','\ufeff'+rows.map(row=>row.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function printReport(){let w=window.open('','_blank');if(!w){toast('Permite ventanas emergentes para generar el informe');return}w.document.write(`<html><head><title>Informe de ausencias</title><style>body{font:12px Arial;padding:25px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px;text-align:left}</style></head><body><h1>Control de ausencias</h1><p>Generado: ${fmt(iso(new Date()))}</p><h2>Saldo de vacaciones</h2><table><tr><th>Empleado</th><th>Asignados</th><th>Disfrutados</th><th>Disponibles</th></tr>${state.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${e.entitlement}</td><td>${usedVac(e.id,new Date().getFullYear())}</td><td>${balance(e,new Date().getFullYear())}</td></tr>`).join('')}</table><h2>Registros</h2><table><tr><th>Empleado</th><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Detalle</th></tr>${state.records.map(r=>`<tr><td>${esc(emp(r.employeeId)?.name||'')}</td><td>${typeLabel(r.type)}</td><td>${r.start}</td><td>${r.end}</td><td>${r.type==='vacaciones'?recordDays(r)+' días':esc(r.duration||r.notes||'')}</td></tr>`).join('')}</table><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
